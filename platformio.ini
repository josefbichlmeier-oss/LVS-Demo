;
; D621-LVS - ESP32-Zielbuild
;
; Baut die Hazeltine-Anbindung (UART2 -> MAX3232 -> Hazeltine 2000A/B).
; Fuer den Linux-Debug-Build (ANSI, virtuelle Konsole) siehe Makefile.
;
; Board ggf. an das tatsaechlich verwendete ESP32-Modul anpassen
; (z.B. esp32doit-devkit-v1, esp32-s3-devkitc-1, ...). "esp32dev"
; passt auf die meisten gaengigen ESP32-Devkits mit klassischem
; Xtensa-ESP32-Chip.
;

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

build_src_filter =
    +<*>
    -<main.c>
    -<terminal_linux.c>
    -<tastatur_linux.c>
    -<zeit_port_linux.c>
    -<monotonzeit_linux.c>

build_flags =
    -Wall
    -Wextra
    -Iconfig

; Nur tatsaechlich benoetigt, wenn in config/config.h
; D621_NOKIA5110_AKTIV auf 1 steht (optionales Diagnose-Display,
; siehe src/diagnose_anzeige.cpp) - schaden aber nicht, wenn das
; Display nicht angeschlossen ist, PlatformIO laedt sie nur einmal
; beim ersten Build herunter.
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit PCD8544 Nokia 5110 LCD library

monitor_speed = 115200
